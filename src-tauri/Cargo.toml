[package]
name = "congcong-tv-windows-tauri2"
version = "1.0.21"
description = "丛丛影视 Windows 桌面客户端"
authors = ["丛丛影视"]
edition = "2021"

[lib]
name = "congcong_tv_windows_tauri2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
