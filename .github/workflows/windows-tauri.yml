name: Windows Tauri build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:win

      - name: Show installer size
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0}: {1:N2} MiB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: cc-tv-windows-tauri2-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
