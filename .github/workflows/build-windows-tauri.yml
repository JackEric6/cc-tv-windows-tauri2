name: Windows Tauri build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '将本次构建资产上传到 Release'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签；留空时使用 package.json 版本'
        required: false
        type: string
        default: ''
      asset_suffix:
        description: '可选资产后缀，用于同一 Release 中区分分支构建'
        required: false
        type: string
        default: ''
      app_version:
        description: '构建版本号；留空时使用分支内版本'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set requested app version
        if: github.event_name == 'workflow_dispatch' && inputs.app_version != ''
        shell: pwsh
        run: |
          $appVersion = '${{ inputs.app_version }}'.Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid app version: $appVersion" }

          npm version $appVersion --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set npm package version' }

          $cargoPath = 'src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^(version\s*=\s*")\d+\.\d+\.\d+("\s*)$', "`${1}$appVersion`${2}", 1)
          Set-Content -Path $cargoPath -Value $cargo -NoNewline

          $tauriPath = 'src-tauri/tauri.conf.json'
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $appVersion
          $tauri | ConvertTo-Json -Depth 100 | Set-Content -Path $tauriPath -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:win

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $suffix = '${{ inputs.asset_suffix }}'.Trim()
          $assetSuffix = if ($suffix) { "-$suffix" } else { '' }
          $installerDirectory = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem "$installerDirectory/*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Tauri installer was not created' }
          $installerName = "cc-tv-windows-tauri2-$version$assetSuffix-setup.exe"
          Rename-Item -LiteralPath $installer.FullName -NewName $installerName

          $portableInstall = Join-Path $env:RUNNER_TEMP 'cc-tv-windows-tauri2-portable-install'
          $portableStage = Join-Path $env:RUNNER_TEMP 'cc-tv-windows-tauri2-portable-stage'
          $portableOutput = 'src-tauri/target/release/bundle/portable'
          New-Item -ItemType Directory -Force -Path $portableOutput | Out-Null
          $install = Start-Process -FilePath (Join-Path $installerDirectory $installerName) -ArgumentList @('/S', "/D=$portableInstall") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Get-ChildItem -LiteralPath $portableInstall -Force | Copy-Item -Destination $portableStage -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $portableStage 'uninstall.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $portableStage 'uninstall.dat') -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $portableStage -Recurse -File -Filter '*.ico' | Remove-Item -Force
          foreach ($requiredFile in @('congcong-tv-windows-tauri2.exe', 'backend.cjs', 'node.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableStage $requiredFile))) {
              throw "Portable package is missing $requiredFile"
            }
          }
          $portableName = "cc-tv-windows-tauri2-$version$assetSuffix-portable.zip"
          $portableZip = Join-Path $portableOutput $portableName
          Compress-Archive -Path (Join-Path $portableStage '*') -DestinationPath $portableZip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($portableZip)
          try {
            $iconEntry = $archive.Entries | Where-Object { $_.FullName -match '(?i)\.ico$' } | Select-Object -First 1
            if ($iconEntry) { throw "Portable archive must not include icon files: $($iconEntry.FullName)" }
          } finally {
            $archive.Dispose()
          }

          $releaseAssets = 'src-tauri/target/release/bundle/release-assets'
          New-Item -ItemType Directory -Force -Path $releaseAssets | Out-Null
          Copy-Item -LiteralPath (Join-Path $installerDirectory $installerName) -Destination $releaseAssets
          Copy-Item -LiteralPath $portableZip -Destination $releaseAssets

      - name: Show installer size
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/release-assets/* | ForEach-Object {
            "{0}: {1:N2} MiB" -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cc-tv-windows-tauri2-release-assets
          path: src-tauri/target/release/bundle/release-assets/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ inputs.release_tag }}'.Trim()
          if (-not $tag) { $tag = $version }
          $assets = Get-ChildItem 'src-tauri/target/release/bundle/release-assets/*' | ForEach-Object { $_.FullName }
          if (-not $assets) { throw '没有可上传的 Release 资产' }
          gh release upload $tag @assets --repo '${{ github.repository }}' --clobber
